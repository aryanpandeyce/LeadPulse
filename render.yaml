# Render Blueprint for LeadPulse Backend API (Docker Web Service)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: leadpulse-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROCESS_POOL_MAX_WORKERS
        value: "1"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_AGENT_PASSWORD
        sync: false

